  <body>
    <canvas id="game"></canvas>

    <button id="wardrobe-btn" class="corner-btn hidden" aria-label="Wardrobe" type="button">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 20 L12 5 L19 20 Z" fill="#FF7A63" stroke="#2B2333" stroke-width="1.8" />
        <path d="M8.2 13.2 L15.2 11.4 M6.6 16.8 L17 14.2" stroke="#FEE580" stroke-width="2" />
        <circle cx="12" cy="4" r="2.2" fill="#FEE580" stroke="#2B2333" stroke-width="1.5" />
      </svg>
    </button>
    <button id="options-btn" class="corner-btn hidden" aria-label="Options" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2B2333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>

    <div id="menu-backdrop" class="menu-backdrop hidden">
      <div id="options-panel" class="menu-panel hidden" role="dialog" aria-label="Options">
        <button class="menu-close" data-close type="button" aria-label="Close">&#10005;</button>
        <h2>Options</h2>
        <div class="toggle-row">
          <span>Sound</span>
          <button id="sound-toggle" class="toggle" role="switch" type="button">
            <span class="toggle-knob"></span>
          </button>
        </div>
        <div class="toggle-row">
          <span>Music <small style="opacity:.6">(beta)</small></span>
          <button id="music-toggle" class="toggle" role="switch" type="button">
            <span class="toggle-knob"></span>
          </button>
        </div>
        <div class="toggle-row">
          <span>Vibration</span>
          <button id="vibration-toggle" class="toggle" role="switch" type="button">
            <span class="toggle-knob"></span>
          </button>
        </div>
        <p class="menu-footer">Boonty Puff &middot; made for Boonty</p>
      </div>

      <div id="wardrobe-panel" class="menu-panel hidden" role="dialog" aria-label="Wardrobe">
        <button class="menu-close" data-close type="button" aria-label="Close">&#10005;</button>
        <h2>Wardrobe</h2>
        <p id="wardrobe-coins" class="menu-sub"></p>
        <div id="wardrobe-grid" class="wardrobe-grid"></div>
      </div>
    </div>

    <!-- Event / contest mode: title screen badges -->
    <div id="event-top-badge" class="hidden"></div>
    <div id="event-mode-badge" class="hidden"></div>

    <!-- Event / contest mode: bottom entry button -->
    <button id="event-enter-btn" class="hidden" type="button">&#127942; Enter the contest</button>

    <!-- Score sharing: bottom-right round button -->
    <button id="share-btn" class="hidden" type="button" aria-label="Share score">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"></circle>
        <circle cx="6" cy="12" r="3"></circle>
        <circle cx="18" cy="19" r="3"></circle>
        <line x1="8.6" y1="10.6" x2="15.4" y2="6.4"></line>
        <line x1="8.6" y1="13.4" x2="15.4" y2="17.6"></line>
      </svg>
      <span>Share my score</span>
    </button>
    <div id="share-toast"></div>

    <!-- Event / contest mode: modal panels (separate backdrop from the options/wardrobe menu) -->
    <div id="event-backdrop" class="menu-backdrop hidden">
      <div id="event-form-panel" class="menu-panel hidden" role="dialog" aria-label="Enter the contest"></div>
      <div id="event-result-panel" class="menu-panel hidden" role="dialog" aria-label="Contest result"></div>
      <div id="admin-pin-panel" class="menu-panel hidden" role="dialog" aria-label="Admin PIN"></div>
      <div id="admin-panel" class="menu-panel hidden" role="dialog" aria-label="Admin"></div>
    </div>

  </body>
